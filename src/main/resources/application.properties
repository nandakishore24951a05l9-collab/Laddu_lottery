# ===============================
# Database Configuration (H2 file-based)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/localcraftdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# IMPORTANT: keep update so schema evolves, but note: update DOES NOT DROP COLUMNS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# ===============================
# File Upload Config
# ===============================
app.upload.dir=${user.home}/localcraft_uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# ===============================
# SMS Config
# ===============================
# Select provider: fast2sms OR fastmessage
sms.provider=fast2sms

# --- Fast2SMS ---
fast2sms.api.key=YOUR_FAST2SMS_KEY_HERE
fast2sms.api.url=https://www.fast2sms.com/dev/bulkV2

# --- FastMessage ---
fastmessage.api.url=https://smsapi.fastmessage.in/send
fastmessage.api.token=JI7Yn0pLRqQR2xrZJeMON6i7H9dCTmrf50K4ZoWTJpn6uBErc0ouYjRChJus
fastmessage.api.senderid=LOCALCR
fastmessage.api.route=2
fastmessage.api.country=91

# ===============================
# Debugging
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
